<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Taroguiando — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display+SC:wght@400;700&family=Lato:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/admin/auth-guard.js"></script>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="section-label">TAROGUIANDO</div>
    <h1>Painel administrativo</h1>
    <p class="sub">Acesso restrito à terapeuta.</p>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">Entrar</button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <p style="text-align:center; margin-top:18px;">
      <a href="#" id="esqueci-link" style="font-size:13px; color:var(--text-mid); text-decoration:underline;">Esqueci minha senha</a>
    </p>

    <div id="forgot-wrap" style="display:none; text-align:left; margin-top:12px;">
      <div class="field">
        <label for="forgot-email">Confirme seu e-mail para receber o link</label>
        <input type="email" id="forgot-email" placeholder="seu@email.com">
      </div>
      <button type="button" class="btn" id="forgot-send-btn" style="width:100%; justify-content:center;">Enviar link de recuperação</button>
      <div class="error-msg" id="forgot-msg"></div>
    </div>
  </div>
</div>

<script>
(async function () {
  // Se já estiver logada, pula direto para o painel.
  var { data } = await window.supabaseClient.auth.getSession();
  var session = data && data.session;
  if (session && session.user && session.user.email === window.ADMIN_EMAIL) {
    window.location.href = '/admin/index.html';
    return;
  }

  var form = document.getElementById('login-form');
  var btn = document.getElementById('login-btn');
  var errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorMsg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    var { data: loginData, error } = await window.supabaseClient.auth.signInWithPassword({ email: email, password: password });

    if (error || !loginData.session || loginData.session.user.email !== window.ADMIN_EMAIL) {
      if (!error) {
        await window.supabaseClient.auth.signOut();
      }
      errorMsg.textContent = 'E-mail ou senha incorretos.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    window.location.href = '/admin/index.html';
  });

  var esqueciLink = document.getElementById('esqueci-link');
  var forgotWrap = document.getElementById('forgot-wrap');
  var forgotEmail = document.getElementById('forgot-email');
  var forgotBtn = document.getElementById('forgot-send-btn');
  var forgotMsg = document.getElementById('forgot-msg');

  esqueciLink.addEventListener('click', function (e) {
    e.preventDefault();
    var abrir = forgotWrap.style.display === 'none';
    forgotWrap.style.display = abrir ? 'block' : 'none';
    if (abrir) forgotEmail.value = document.getElementById('email').value;
  });

  forgotBtn.addEventListener('click', async function () {
    var email = forgotEmail.value.trim();
    forgotMsg.style.color = '';
    if (!email) {
      forgotMsg.textContent = 'Digite seu e-mail.';
      return;
    }

    forgotBtn.disabled = true;
    forgotBtn.textContent = 'Enviando...';

    var { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/admin/redefinir-senha.html'
    });

    forgotBtn.disabled = false;
    forgotBtn.textContent = 'Enviar link de recuperação';

    if (error) {
      forgotMsg.style.color = 'var(--danger)';
      forgotMsg.textContent = 'Não consegui enviar agora. Tente novamente em instantes.';
      return;
    }

    forgotMsg.style.color = 'var(--lavender-deep)';
    forgotMsg.textContent = 'Se esse e-mail estiver cadastrado, você vai receber um link em instantes. Confira também o spam.';
  });
})();
</script>

</body>
</html>

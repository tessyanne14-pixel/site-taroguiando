<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Taroguiando — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display+SC:wght@400;700&family=Lato:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase-config.js"></script>
<script src="auth-guard.js"></script>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="section-label">TAROGUIANDO</div>
    <h1>Painel administrativo</h1>
    <p class="sub">Acesso restrito à terapeuta.</p>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">Entrar</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>
</div>

<script>
(async function () {
  // Se já estiver logada, pula direto para o painel.
  var { data } = await window.supabaseClient.auth.getSession();
  var session = data && data.session;
  if (session && session.user && session.user.email === window.ADMIN_EMAIL) {
    window.location.href = 'index.html';
    return;
  }

  var form = document.getElementById('login-form');
  var btn = document.getElementById('login-btn');
  var errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorMsg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    var { data: loginData, error } = await window.supabaseClient.auth.signInWithPassword({ email: email, password: password });

    if (error || !loginData.session || loginData.session.user.email !== window.ADMIN_EMAIL) {
      if (!error) {
        await window.supabaseClient.auth.signOut();
      }
      errorMsg.textContent = 'E-mail ou senha incorretos.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'index.html';
  });
})();
</script>

</body>
</html>
